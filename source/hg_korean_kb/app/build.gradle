apply plugin: 'com.android.application'

android {
    compileSdkVersion 29

    // Same package as Manifest / AOSP module.
    namespace 'com.higenis.keyboard'

    defaultConfig {
        applicationId "com.higenis.keyboard"
        minSdkVersion 29
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
        }
    }
}

// No dependencies — framework public APIs + java.util only.
dependencies {
}
